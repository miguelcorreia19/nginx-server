
server {
	listen 80;
	listen [::]:80;

  server_name ${SERVER_NAMES};

	# ACME http-01 challenge files are served directly from the shared webroot
	# (never redirected to HTTPS) so Let's Encrypt can validate this domain over
	# HTTP. Renewal uses the webroot authenticator and writes its tokens here, so
	# this location is what keeps renewal working while nginx holds port 80. The
	# `^~` prefix is matched before the catch-all redirect below, so normal
	# requests are unaffected.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type "text/plain";
	}

	location / {
		return 301 https://$host$request_uri;
	}
}
