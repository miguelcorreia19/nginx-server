# Default HTTPS server for any host with no dedicated :443 block. nginx requires
# a certificate on an SSL listener, so this synthesises an empty one inline:
# `map` supplies an always-empty $empty, `data:$empty` is an inline (not file)
# certificate, and `aNULL` is the only cipher suite that needs no key material.
# The handshake is therefore refused rather than served under some other site's
# certificate. See https://serverfault.com/a/1044022
#
# This applies only to an SSL listener. The port-80 default vhost carried the
# same three directives for a long time, where nginx never reaches the TLS path
# at all and they did nothing; they were removed from it.
map "" $empty {
        default "";
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;

  server_name _;

  ssl_ciphers aNULL;
  ssl_certificate data:$empty;
  ssl_certificate_key data:$empty;

  return 444;
}