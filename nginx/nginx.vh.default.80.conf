# https://serverfault.com/a/1044022

map "" $empty {
        default "";
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;

  ssl_ciphers aNULL;
  ssl_certificate data:$empty;
  ssl_certificate_key data:$empty;

  # Serve ACME http-01 challenge files for any host that has no dedicated
  # port-80 server block (e.g. Let's Encrypt domains with http_redirect=false).
  # Renewal currently uses standalone mode; this prepares for a future
  # webroot-based renewal model. Normal requests still get the 444 below.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 444;
  }
}
