server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;

  # Serve ACME http-01 challenge files for any host that has no dedicated
  # port-80 server block (e.g. Let's Encrypt domains with http_redirect=false).
  # Renewal uses the webroot authenticator and certbot writes its challenge
  # tokens here, so this location is load-bearing during renewal — nginx keeps
  # port 80 throughout. Normal requests still get the 444 below.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 444;
  }
}
