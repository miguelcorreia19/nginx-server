name: Security scan

# Daily: scans the image users actually pull (Docker Hub :latest), separately
# for each architecture. Weekly: rebuilds the current Dockerfile from fresh
# upstream metadata and compares it with the published image. Neither job
# publishes, tags or pushes anything, and neither uses repository secrets.
# Failure policy, triage and remediation: docs/security-scanning.md.

on:
  schedule:
    - cron: '23 4 * * *' # published image, daily
    - cron: '47 5 * * 1' # fresh rebuild, Mondays
  workflow_dispatch:
    inputs:
      check:
        description: Which check to run
        type: choice
        options: [both, published, rebuild]
        default: both

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/miguelcorreia19/nginx-server:latest
  NGINX_ADVISORIES_URL: https://nginx.org/en/security_advisories.html
  TRIVY_DISABLE_TELEMETRY: 'true'
  TRIVY_SKIP_VERSION_CHECK: 'true'
  TRIVY_NO_PROGRESS: 'true'
  TRIVY_TIMEOUT: 15m
  # Every scan: vulnerabilities in OS packages and application dependencies;
  # "comprehensive" so the Python packages Alpine installs for Certbot are
  # matched as well; and no ignore file, so a .trivyignore cannot suppress
  # anything.
  TRIVY_SCANNERS: vuln
  TRIVY_PKG_TYPES: os,library
  TRIVY_DETECTION_PRIORITY: comprehensive
  TRIVY_IGNOREFILE: /dev/null

jobs:
  published:
    name: Published image (linux/${{ matrix.arch }})
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '23 4 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.check != 'rebuild')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: ./.github/actions/install-trivy

      - name: Download the vulnerability database
        run: |
          mkdir -p scan-results
          trivy image --download-db-only
          trivy version --format json > scan-results/trivy-version.json

      - name: Resolve the published image and its upstream base
        id: resolve
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' \
            | jq -r --arg arch "$ARCH" '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
          if [ -z "$digest" ]; then
            echo "::error title=Missing architecture::$IMAGE publishes no linux/$ARCH image"
            exit 1
          fi
          echo "ref=${IMAGE%:*}@${digest}" >> "$GITHUB_OUTPUT"
          # The base image this exact image was built from, as recorded in its
          # build provenance. Absent provenance leaves the comparison out
          # rather than guessing it from the current Dockerfile.
          base=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Provenance}}' \
            | jq -r --arg p "linux/$ARCH" '(if has("SLSA") then . else .[$p] end) // {} | .SLSA // {}
                | ((.buildDefinition.resolvedDependencies // []) + (.materials // []))[]
                | select(.uri | startswith("pkg:docker/")) | "\(.uri)|\(.digest.sha256)"' | head -n 1)
          if [ -n "$base" ]; then
            name=${base#pkg:docker/}
            echo "base=${name%%@*}@sha256:${base##*|}" >> "$GITHUB_OUTPUT"
            tag=${name%%\?*}
            echo "base_tag=${tag/@/:}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the published image
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          trivy image --skip-db-update --format json --image-src remote --platform "linux/$ARCH" \
            --output "scan-results/published-$ARCH.json" "$REF"

      - name: Scan its upstream base image
        if: steps.resolve.outputs.base != ''
        env:
          BASE: ${{ steps.resolve.outputs.base }}
        run: |
          trivy image --skip-db-update --format json --image-src remote --platform "linux/$ARCH" \
            --output "scan-results/base-$ARCH.json" "$BASE"

      - name: Fetch the nginx.org security advisories
        run: curl -fsSL --retry 3 -o scan-results/nginx-advisories.html "$NGINX_ADVISORIES_URL"

      - name: Convert the report to SARIF
        id: sarif
        run: trivy convert --format sarif --output "scan-results/published-$ARCH.sarif" "scan-results/published-$ARCH.json"

      - name: Apply the vulnerability policy
        env:
          REF: ${{ steps.resolve.outputs.ref }}
          BASE_TAG: ${{ steps.resolve.outputs.base_tag }}
        run: |
          args=(--report "scan-results/published-$ARCH.json" --arch "$ARCH"
                --nginx-advisories scan-results/nginx-advisories.html
                --title "Published image $IMAGE" --summary "$GITHUB_STEP_SUMMARY"
                --trivy-version scan-results/trivy-version.json
                --note "Scanned by digest: \`$REF\`.")
          if [ -f "scan-results/base-$ARCH.json" ]; then
            args+=(--base "scan-results/base-$ARCH.json" --note "Upstream base from build provenance: \`$BASE_TAG\`.")
          fi
          node .github/scripts/security-report.js "${args[@]}"

      - name: Upload the scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-published-${{ matrix.arch }}
          path: scan-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload to GitHub code scanning
        if: always() && steps.sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scan-results/published-${{ matrix.arch }}.sarif
          category: trivy-published-linux-${{ matrix.arch }}

  rebuild:
    name: Fresh rebuild (linux/${{ matrix.arch }})
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 5 * * 1')
      || (github.event_name == 'workflow_dispatch' && inputs.check != 'published')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH: ${{ matrix.arch }}
      CANDIDATE: nginx-server:candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: ./.github/actions/install-trivy

      - name: Download the vulnerability database
        run: |
          mkdir -p scan-results
          trivy image --download-db-only
          trivy version --format json > scan-results/trivy-version.json

      # A native build on each architecture's own runner: no emulation, and the
      # image only ever exists in this runner's local Docker daemon.
      - name: Build a candidate image (never published)
        run: docker build --pull --no-cache --tag "$CANDIDATE" .

      # Everything below uses this one per-architecture digest, so the scan, the
      # package comparison and the report all describe the same image.
      - name: Resolve and pull the published image
        id: published
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format \
            "{{range .Manifest.Manifests}}{{if and .Platform (eq .Platform.OS \"linux\") (eq .Platform.Architecture \"$ARCH\")}}{{.Digest}}{{end}}{{end}}")
          if [ -z "$digest" ]; then
            echo "::error title=Missing architecture::$IMAGE publishes no linux/$ARCH image"
            exit 1
          fi
          ref="${IMAGE%:*}@${digest}"
          docker pull "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Scan the candidate, the published image and the upstream base
        id: scan
        env:
          PUBLISHED: ${{ steps.published.outputs.ref }}
        run: |
          base=$(awk 'toupper($1) == "FROM" { i = 2; while ($i ~ /^--/) i++; image = $i } END { print image }' Dockerfile)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          scan() { trivy image --skip-db-update --format json --platform "linux/$ARCH" "$@"; }
          scan --image-src docker --output "scan-results/candidate-$ARCH.json" "$CANDIDATE"
          scan --image-src remote --output "scan-results/published-$ARCH.json" "$PUBLISHED"
          scan --image-src remote --output "scan-results/base-$ARCH.json" "$base"

      - name: Compare Alpine packages
        env:
          PUBLISHED: ${{ steps.published.outputs.ref }}
        run: |
          packages() { docker run --rm --platform "linux/$ARCH" --entrypoint apk "$1" info -v | sort; }
          packages "$CANDIDATE" > "scan-results/packages-candidate-$ARCH.txt"
          packages "$PUBLISHED" > "scan-results/packages-published-$ARCH.txt"
          docker run --rm --platform "linux/$ARCH" --entrypoint apk "$PUBLISHED" --no-cache list --upgradable \
            > "scan-results/upgradable-published-$ARCH.txt"
          changes=$(diff "scan-results/packages-published-$ARCH.txt" "scan-results/packages-candidate-$ARCH.txt" || true)
          {
            echo "### Alpine packages — linux/$ARCH"
            echo
            echo "Updates Alpine currently offers for the published image (\`apk list --upgradable\`):"
            echo '```'
            if [ -s "scan-results/upgradable-published-$ARCH.txt" ]; then cat "scan-results/upgradable-published-$ARCH.txt"; else echo '(none)'; fi
            echo '```'
            echo "Packages that differ between the published image (-) and the fresh rebuild (+):"
            echo '```diff'
            if [ -n "$changes" ]; then printf '%s\n' "$changes" | sed -n 's/^< /- /p; s/^> /+ /p'; else echo '(no differences)'; fi
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the nginx.org security advisories
        run: curl -fsSL --retry 3 -o scan-results/nginx-advisories.html "$NGINX_ADVISORIES_URL"

      - name: Apply the vulnerability policy to the candidate
        env:
          BASE: ${{ steps.scan.outputs.base }}
          PUBLISHED: ${{ steps.published.outputs.ref }}
        run: |
          node .github/scripts/security-report.js \
            --report "scan-results/candidate-$ARCH.json" \
            --base "scan-results/base-$ARCH.json" \
            --published "scan-results/published-$ARCH.json" \
            --nginx-advisories scan-results/nginx-advisories.html \
            --arch "$ARCH" \
            --title "Fresh rebuild of ${GITHUB_SHA::12} (not published)" \
            --note "Built with \`docker build --pull --no-cache\` from \`$BASE\`; compared with \`$PUBLISHED\` (\`$IMAGE\`)." \
            --trivy-version scan-results/trivy-version.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-rebuild-${{ matrix.arch }}
          path: scan-results/
          if-no-files-found: ignore
          retention-days: 30
