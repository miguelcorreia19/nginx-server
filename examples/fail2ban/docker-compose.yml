version: "3"

services:
  nginx-server:
    image: miguelcorreia19/nginx-server:latest
    container_name: nginx-server
    restart: always
    # Required for Fail2ban to install iptables ban rules. Without it the
    # container still runs, but Fail2ban logs a warning and skips startup.
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/sites/:/home/nginx/sites
      - ./nginx/config.json:/home/config.json
      - ./public:/var/www/html/
      # Password file for the basic-auth demo endpoint (read-only).
      - ./nginx/.htpasswd:/home/nginx/.htpasswd:ro
    environment:
      - ENVIRONMENT=production
      # Opt in to Fail2ban (disabled by default). Enables the nginx-http-auth
      # and nginx-botsearch jails on nginx's error log.
      - FAIL2BAN_ENABLED=true
      # Optional tuning (defaults: 3600 / 3600 / 6). Lowered here only so the
      # demo bans an IP after a few failed logins — remove to use the defaults.
      - FAIL2BAN_FINDTIME=600
      - FAIL2BAN_MAXRETRY=3
      - FAIL2BAN_BANTIME=3600
