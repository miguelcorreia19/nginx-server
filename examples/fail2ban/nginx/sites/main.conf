server {
	# Please don't remove this line, it helps to apply the
	# necessary configuration for each running mode. The name of the
	# file needs to be the same defined on config.json (here: "main").
	include /etc/nginx/conf/main.conf;

	server_name localhost;

	# Public area — open to everyone.
	location / {
		root  /var/www/html;
		index index.html;
	}

	# Generic basic-auth protected area used to demonstrate the
	# nginx-http-auth jail. Repeated failed logins here are recorded in
	# nginx's error log; with FAIL2BAN_ENABLED=true the offending IP is
	# banned. This is a generic protected location, not an application login URL.
	#
	# Note: the location serves a real file (not `return`), so the auth_basic
	# access phase is actually enforced before any response is produced.
	location /protected/ {
		auth_basic           "Restricted";
		auth_basic_user_file /home/nginx/.htpasswd;

		root  /var/www/html;
		index index.html;
	}
}
