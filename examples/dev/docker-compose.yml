version: "3"

services:
  nginx-server:
    image: miguelcorreia19/nginx-server:latest
    container_name: nginx-server
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - 81:80
      - 444:443
    volumes:
      - ./nginx/sites/:/home/nginx/sites
      - ./nginx/config.json:/home/config.json
    environment:
      - ENVIRONMENT=development

  example:
    image: example
    container_name: example
    ports:
      - 12345:12345
