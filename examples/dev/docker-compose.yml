services:
  nginx-server:
    image: miguelcorreia19/nginx-server:latest
    container_name: nginx-server
    restart: always
    ports:
      - 81:80
      - 444:443
    volumes:
      - ./nginx/sites/:/home/nginx/sites
      - ./nginx/config.json:/home/config.json
    environment:
      - ENVIRONMENT=development

  example:
    image: traefik/whoami
    container_name: example
    command: --port 12345
    ports:
      - 12345:12345
