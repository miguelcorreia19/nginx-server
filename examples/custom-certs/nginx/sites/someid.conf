# Proxies to the "service1" container by name and re-resolves that name
# through Docker's DNS, so a recreated backend with a new IP is picked up
# without a reload — see docs/configuration.md -> Proxying to other Docker
# containers.
upstream service1_upstream {
	zone service1_upstream 64k;
	resolver 127.0.0.11 valid=10s;
	server service1:12345 resolve;
}

server {
	# Please don't remove this line, it helps to apply the 
	# necessary SSL configurations for each running mode 
	# The name of the file needs
	# to be the same defined on conf.json
	include /etc/nginx/conf/someid.conf;
	
	server_name example.com;

	location / {
		proxy_pass http://service1_upstream/;
	}
}
