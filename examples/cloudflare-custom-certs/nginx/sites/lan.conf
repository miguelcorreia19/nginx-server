# Proxies to the "example-backend" container by name and re-resolves that
# name through Docker's DNS, so a recreated backend with a new IP is picked
# up without a reload — see docs/configuration.md -> Proxying to other Docker
# containers.
upstream example_backend_upstream {
	zone example_backend_upstream 64k;
	resolver 127.0.0.11 valid=10s;
	server example-backend:80 resolve;
}

server {
	# Please don't remove this line, it helps to apply the
	# necessary SSL configurations for each running mode. The name of the
	# file needs to be the same defined on config.json (here: "lan").
	include /etc/nginx/conf/lan.conf;

	server_name home.lan.example.com;

	location / {
		proxy_pass http://example_backend_upstream;

		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket upgrade, kept because a wildcard vhost usually fronts an
		# application that needs it.
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}
